spring.application.name=ca-billing-system

# H2 embedded database - saves to a file on the desktop
spring.datasource.url=jdbc:h2:file:~/ca-billing-data/billing;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Optional: H2 web console for debugging
spring.h2.console.enabled=false

server.port=8080
spring.main.allow-circular-references=true
